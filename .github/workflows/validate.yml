name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            evals/requirements.txt
            skills/data-analysis/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg poppler-utils

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt

      - name: Run repository validation
        run: >-
          python tests/run_all.py
          --compare-baseline reports/restructure-baseline-20260730/run_all.json
